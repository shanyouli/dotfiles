name: "system build"
on:
  repository_dispatch:
    types: [Build-check]
  push:
    branches:
      - master
    paths:
      - "flake/**/*.nix"
      - "flake/**/flake.lock"
      - "hosts/**/*.nix"
      - "modules/**/*.nix"
      - "nix/**/*.nix"

  pull_request_target:
    branches:
      - master
    paths:
      - "flake/**/*.nix"
      - "flake/**/flake.lock"
      - "hosts/**/*.nix"
      - "modules/**/*.nix"
      - "nix/**/*.nix"
  # schedule:
  #   # run this daily at 8am UTC, or roughly 4am eastern
  #   - cron: '45 2 * * 6'
  workflow_dispatch:
jobs:
  use_branch:
    runs-on: ubuntu-latest
    outputs:
      MY_TARGET_BRANCH: ${{ steps.determine_branch.outputs.runbranch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - name: get last commit time of master branch
        id: get_master_time
        run: |
          git fetch origin master
          MASTER_COMMIT_TIME=$(git log -1 --format=%ct origin/master)
          echo "Current flakebot Last commit time is ${MASTER_COMMIT_TIME}"
          echo "MASTER_COMMIT_TIME=${MASTER_COMMIT_TIME}" >> $GITHUB_ENV
      - name: get last commit time of flakebot
        id: get_flakebot_time
        run: |
          git fetch origin flakebot
          FLAKEBOT_COMMIT_TIME=$(git log -1 --format=%ct origin/flakebot)
          echo "Current flakebot Last commit time is ${FLAKEBOT_COMMIT_TIME}"
          echo "FLAKEBOT_COMMIT_TIME=${FLAKEBOT_COMMIT_TIME}" >> $GITHUB_ENV
      - name: use target branch
        id: determine_branch
        run: |
          if [[ "${MASTER_COMMIT_TIME}" -gt "${FLAKEBOT_COMMIT_TIME}" ]]; then
            echo "Will be working on master branch"
            echo "runbranch=master" >> $GITHUB_OUTPUT
          else
            echo "Will be working on flakebot branch"
            echo "runbranch=flakebot" >> $GITHUB_OUTPUT
          fi
  build:
    needs:
      - use_branch
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      MY_TARGET_BRANCH: ${{ needs.use_branch.outputs.MY_TARGET_BRANCH }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow clones won't work
          fetch-depth: 0
          persist-credentials: false
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Free Disk Space (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          df -h
          brew list
          [[ -d /Applications/Xcode_16.1_beta.app ]] && sudo rm -rf /Applications/Xcode_16.1_beta.app
          [[ -d /Applications/Xcode_16_beta_6.app ]] && sudo rm -rf /Applications/Xcode_16_beta_6.app
          [[ -d /Applications/Xcode_15.1.app ]] && sudo rm -rf /Applications/Xcode_15.1.app
          [[ -d /Applications/Xcode_15.2.app ]] && sudo rm -rf  /Applications/Xcode_15.2.app
          [[ -d /Applications/Xcode_15.3.app ]] && sudo rm -rf  /Applications/Xcode_15.3.app
          [[ -d /Applications/Xcode_14.3.1.app ]] && sudo rm -rf /Applications/Xcode_14.3.1.app
          [[ -d /Applications/Xcode_15.0.1.app ]] && sudo rm -rf /Applications/Xcode_15.0.1.app
          brew uninstall --zap google-chrome
          df -h
      - name: checkout target branch
        run: |
          git fetch
          git checkout ${MY_TARGET_BRANCH}
          echo "Working on ${MY_TARGET_BRANCH} branch"
      - name: Prepare git identity
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.114.1"
      - name: Setup just
        uses: extractions/setup-just@v4
      - uses: cachix/cachix-action@v17
        with:
          name: "shanyouli"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Print CPU info
        run: |
          if command -v nproc >/dev/null ; then
            echo "Cores: $(nproc), Arch: $(uname -p)"
          else
            echo "Cores: $(nix shell nixpkgs#coreutils-full -c nproc) , Arch: $(uname -p)"
          fi
      - name: Prepare root flake
        run: just _root-flake-enable
      - name: "Check: treefmt (formatting)"
        run: |
          SYSTEM="$(nix eval --impure --raw --expr builtins.currentSystem)"
          echo "Building checks.${SYSTEM}.treefmt"
          set -o pipefail
          nix build ".#checks.${SYSTEM}.treefmt" --no-write-lock-file --print-build-logs 2>&1 | tee check-treefmt.log
        timeout-minutes: 10
      - name: "Check: home (test home-manager)"
        run: |
          SYSTEM="$(nix eval --impure --raw --expr builtins.currentSystem)"
          echo "Building checks.${SYSTEM}.home"
          set -o pipefail
          nix build ".#checks.${SYSTEM}.home" --no-write-lock-file --print-build-logs 2>&1 | tee check-home.log
        timeout-minutes: 240
      - name: "Check: os (test host toplevel)"
        run: |
          SYSTEM="$(nix eval --impure --raw --expr builtins.currentSystem)"
          echo "Building checks.${SYSTEM}.os"
          set -o pipefail
          nix build ".#checks.${SYSTEM}.os" --no-write-lock-file --print-build-logs 2>&1 | tee check-os.log
        timeout-minutes: 240
      - name: Flake check (eval + lock update)
        id: check
        run: |
          set -o pipefail
          before_commit="$(git rev-parse HEAD)"
          just ci check 2>&1 | tee ci-check.log
          after_commit="$(git rev-parse HEAD)"
          if [[ "$before_commit" == "$after_commit" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        timeout-minutes: 240
      - name: Push lock updates
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin "${MY_TARGET_BRANCH}"
          git rebase "origin/${MY_TARGET_BRANCH}"
          git push origin "HEAD:${MY_TARGET_BRANCH}"
      - name: Summarize failure
        if: failure()
        run: |
          logs=()
          for f in check-treefmt.log check-home.log check-os.log ci-check.log; do
            [[ -s "$f" ]] && logs+=("$f")
          done
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "::error title=CI failed::no captured check logs found"
            exit 0
          fi
          EXTRACT="$(grep -h -E 'error:|Reason:|final link failed|refers to overlapping' "${logs[@]}" \
            | grep -vE 'libgpg-error|Test-Fatal|Exception-Class|failed to complete successfully|is not installed' \
            | sed 's/^[[:space:]]*//' | head -30 || true)"
          if [[ -n "$EXTRACT" ]]; then
            FIRST_ERROR="$(echo "$EXTRACT" | grep -m1 'error:' | cut -c1-200)"
            echo "::error title=Flake check failed::${FIRST_ERROR:-unknown error}"
            {
              echo "### ❌ Flake check 失败摘要"
              echo ""
              for log in "${logs[@]}"; do
                echo "- 来源: \`${log}\`"
              done
              echo ""
              echo '```'
              echo "$EXTRACT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            LAST_LOG="${logs[${#logs[@]}-1]}"
            echo "::error title=Flake check failed::no error lines matched, see tail of ${LAST_LOG}"
            {
              echo "### ❌ Flake check 失败摘要（未匹配到 error 行，回退显示日志尾部）"
              echo ""
              echo "- 来源: \`${LAST_LOG}\`"
              echo ""
              echo '```'
              tail -n 50 "$LAST_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
  merge-to-master:
    needs:
      - use_branch
      - build
    if: needs.use_branch.outputs.MY_TARGET_BRANCH == 'flakebot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
      - name: Prepare flakebot branch
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"
          git fetch
          git checkout flakebot
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true
